version: "3.8"
services:
  # Your Go application service
  go-app:
    build: .
    ports:
      - "8080:8080"  # Expose your app's metrics on port 8080
    networks:
      - monitoring
    restart: always

  # Prometheus service
  prometheus:
    image: prom/prometheus:v2.43.0
    container_name: prometheus
    volumes:
      - ./internal/api/prometheus.yml:/etc/prometheus/prometheus.yml  # Mount the Prometheus config file
    ports:
      - "9090:9090"  # Expose Prometheus UI on port 9090
    networks:
      - monitoring
    restart: always

networks:
  monitoring:
    driver: bridge

